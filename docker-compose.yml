services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD no arquivo .env}"
    ports:
      - "1433:1433"
    volumes:
      - dbdata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD no arquivo .env}"
    volumes:
      - ./db:/scripts
    entrypoint: ["/bin/bash", "-c", "for f in /scripts/*.sql; do /opt/mssql-tools18/bin/sqlcmd -C -b -I -f 65001 -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -i \"$$f\" || exit 1; done"]
    restart: "no"

  api:
    build: ./api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Padrao: "Server=db;Database=RappyFastFoodDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD no arquivo .env};TrustServerCertificate=True"
      Jwt__Chave: "${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      DEMO_ADMIN_EMAIL: "${DEMO_ADMIN_EMAIL:-}"
      DEMO_ADMIN_PASSWORD: "${DEMO_ADMIN_PASSWORD:-}"
    ports:
      - "0.0.0.0:8080:8080"

  web:
    build: ./web
    depends_on:
      - api
    environment:
      ApiUrl: "http://api:8080"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    ports:
      - "0.0.0.0:8081:8080"

  mobile:
    build: ./mobile
    depends_on:
      - api
    ports:
      - "0.0.0.0:8082:80"

volumes:
  dbdata:
